<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160">
  <defs>
    <!-- Rainbow gradient matching lolcat-style terminal output -->
    <linearGradient id="rainbow" x1="24" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff5555"/>
      <stop offset="17%"  stop-color="#ffb86c"/>
      <stop offset="33%"  stop-color="#f1fa8c"/>
      <stop offset="50%"  stop-color="#50fa7b"/>
      <stop offset="67%"  stop-color="#8be9fd"/>
      <stop offset="83%"  stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>
  <!-- Terminal window background -->
  <rect width="520" height="160" rx="8" fill="#282a36"/>
  <!-- Title bar -->
  <rect width="520" height="32" rx="8" fill="#44475a"/>
  <rect y="24" width="520" height="8" fill="#44475a"/>
  <!-- macOS-style traffic light buttons -->
  <circle cx="20" cy="16" r="6" fill="#ff5555"/>
  <circle cx="40" cy="16" r="6" fill="#ffb86c"/>
  <circle cx="60" cy="16" r="6" fill="#50fa7b"/>
  <!-- "ssh" title -->
  <text x="260" y="21" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#f8f8f2" text-anchor="middle">ssh — root@reMarkable</text>
  <!-- Banner text with rainbow gradient -->
  <text font-family="'Courier New', 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14" fill="url(#rainbow)">
    <tspan x="24" y="62">r e M a r k a b l e</tspan>
    <tspan x="24" dy="22">╺━┓┏━╸┏━┓┏━┓   ┏━┓╻ ╻┏━╸┏━┓┏━┓</tspan>
    <tspan x="24" dy="22">┏━┛┣╸ ┣┳┛┃ ┃   ┗━┓┃ ┃┃╺┓┣━┫┣┳┛</tspan>
    <tspan x="24" dy="22">┗━╸┗━╸╹┗╸┗━┛   ┗━┛┗━┛┗━┛╹ ╹╹┗╸</tspan>
  </text>
</svg>
